# Shared http-level pieces for both lobbyhub sites.
#
# maps and upstreams cannot live inside a server block, so the parts both sites
# need are here rather than duplicated in each.

# What the visitor's browser actually spoke to Cloudflare.
#
# TLS ends at the edge, so every request reaches this machine over plain HTTP and
# $scheme says "http". Left at that, Laravel builds its OAuth redirect_uri as
# http://api.lobbyhub.gg/... — which is not what is registered with Google or
# Discord, and not what Steam will return to. The header is the only place the
# real scheme survives.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https   https;
}

# The same fact in the shape PHP reads it in: a non-empty HTTPS server variable
# is what makes Symfony's Request::isSecure() true, and with the Host header
# carrying no port it then resolves the port to 443 on its own.
map $http_x_forwarded_proto $php_https {
    default "";
    https   on;
}

# A cache in front of PHP, for the reads that are the same for everybody.
#
# It is worth more than it looks. A request to the API costs about the same
# whatever it does — an endpoint reading a handful of rows and one reading
# nothing both answer in about 65 ms, because the framework boots either way.
# This is the only layer that removes the boot rather than the work.
#
# Sized for the answers, not the catalog: the whole set of cacheable URLs is a
# few thousand small JSON bodies, and `inactive` drops the long tail on its own.
fastcgi_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:32m
                   inactive=10m max_size=512m;

# What must never be served from that cache. Two kinds of thing:
#
#   - answers that belong to one person: the vote status of whoever is asking,
#     their favourites, anything in the sign-in flow;
#   - /servers/live, whose entire job is to be newer than the page around it.
#
# A request carrying a token skips it too — see $skip_api_cache's use below.
map $request_uri $api_uncacheable {
    default             0;
    ~^/api/servers/live 1;
    ~^/api/auth/        1;
    ~^/api/favorites    1;
    ~/vote$             1;
    ~/favorite$         1;
}

# Free text has no bounded keyspace, and nginx keys on the URL — a crawler
# walking the search box would fill the zone with entries written once and read
# never, evicting the listings that are read. The application declines to cache
# `q` for the same reason; this is the same rule one layer out.
map $arg_q $api_search {
    default 1;
    ""      0;
}

upstream lobbyhub_web {
    server 127.0.0.1:3000;

    # Next is a single node process; reusing connections keeps this from opening
    # a fresh socket for every asset on a page.
    keepalive 32;
}
