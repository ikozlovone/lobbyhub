# Shared http-level pieces for both lobbyhub sites.
#
# maps and upstreams cannot live inside a server block, so the parts both sites
# need are here rather than duplicated in each.

# What the visitor's browser actually spoke to Cloudflare.
#
# TLS ends at the edge, so every request reaches this machine over plain HTTP and
# $scheme says "http". Left at that, Laravel builds its OAuth redirect_uri as
# http://api.lobbyhub.gg/... — which is not what is registered with Google or
# Discord, and not what Steam will return to. The header is the only place the
# real scheme survives.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https   https;
}

# The same fact in the shape PHP reads it in: a non-empty HTTPS server variable
# is what makes Symfony's Request::isSecure() true, and with the Host header
# carrying no port it then resolves the port to 443 on its own.
map $http_x_forwarded_proto $php_https {
    default "";
    https   on;
}

upstream lobbyhub_web {
    server 127.0.0.1:3000;

    # Next is a single node process; reusing connections keeps this from opening
    # a fresh socket for every asset on a page.
    keepalive 32;
}
