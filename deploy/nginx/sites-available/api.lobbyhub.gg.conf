# api.lobbyhub.gg — the Laravel catalog API.
#
# Its own hostname rather than a path under lobbyhub.gg: /api/revalidate belongs
# to Next, the two have nothing in common cache-wise, and CORS is already
# configured for a separate origin (FRONTEND_ORIGINS).
#
# Port 80 only, for the reason described in lobbyhub.gg.conf.

server {
    listen      80;
    listen      [::]:80;

    # The same API, reachable from this machine without going anywhere near the
    # CDN. The frontend's server-side renders and its production build both read
    # the catalog; through the public address that means out to the edge and back
    # to this box, and it means a build cannot run until the site is reachable
    # from the internet. Point API_URL_INTERNAL here instead.
    #
    # Bound to loopback, so this is not a second public door; requests arriving
    # on it match this block whatever Host they carry, which is the point — there
    # is no name to send.
    listen      127.0.0.1:8080;

    server_name api.lobbyhub.gg;

    root  /var/www/lobbyhub/public;
    index index.php;

    charset utf-8;

    # See lobbyhub.gg.conf: unencrypted origin, so arriving through Cloudflare is
    # the only credential the front door checks.
    if ($from_cloudflare = 0) {
        return 444;
    }

    access_log /var/log/nginx/lobbyhub-api.access.log;
    error_log  /var/log/nginx/lobbyhub-api.error.log;

    # Every write this API takes is a short JSON body — an address, a nickname,
    # six digits.
    client_max_body_size 1m;

    gzip            on;
    gzip_types      application/json;
    gzip_min_length 1024;
    gzip_proxied    any;

    # Game artwork, written by `php artisan games:artwork` and handed to the
    # frontend as absolute URLs on this host. Static files with content that only
    # changes when a game's art does.
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files  $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # $realpath_root rather than $document_root: a deploy that swaps a
        # symlink leaves PHP's opcache holding the old path otherwise.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        # What makes Laravel build https:// URLs on an http origin. Without it
        # the OAuth redirect_uri and Steam's return_to come out as http and the
        # providers refuse them.
        fastcgi_param HTTPS $php_https if_not_empty;

        # A manual refresh queries a game server inline, which is a socket and a
        # five-second timeout, plus whatever the details fetch adds.
        fastcgi_read_timeout 60s;

        fastcgi_hide_header X-Powered-By;

        # The cache in front of PHP. See conf.d/lobbyhub.conf for the zone and
        # for what is excluded from it.
        #
        # How long anything is kept is decided by the application, not here: the
        # public reads carry `Cache-Control: s-maxage=…` from the
        # CachePublicReads middleware, and everything else still says
        # `no-cache, private`, which nginx obeys by not storing it. So the routes
        # that may be shared are named in one place, in the router, rather than
        # duplicated into a second language.
        fastcgi_cache     api;
        fastcgi_cache_key "$request_method$host$request_uri";

        # Belt to the header's braces: a request carrying a token is answered
        # from PHP and its answer is never stored, whatever route it hit.
        fastcgi_cache_bypass $http_authorization $api_uncacheable $api_search;
        fastcgi_no_cache     $http_authorization $api_uncacheable $api_search;

        # Without this, everything that expires at the same moment goes to PHP
        # at the same moment. The first request refreshes it; the rest are held,
        # and then served the copy it brought back.
        fastcgi_cache_lock on;

        # And nobody waits for that refresh: a just-expired copy is served while
        # it happens. `Cache-Control` carries the same instruction to Cloudflare
        # as stale-while-revalidate.
        fastcgi_cache_use_stale         updating error timeout http_500 http_502 http_503;
        fastcgi_cache_background_update on;

        # HIT / MISS / BYPASS / EXPIRED / UPDATING, for finding out which of
        # them a slow request was.
        add_header X-Cache $upstream_cache_status always;
    }

    # Everything hidden except ACME's directory, which has to stay reachable if
    # this host ever gets a certificate of its own.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
