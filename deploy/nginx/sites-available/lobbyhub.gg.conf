# lobbyhub.gg — the Next.js frontend.
#
# Port 80 only, and that is deliberate: with Cloudflare's SSL/TLS mode set to
# Flexible, the edge terminates TLS and speaks HTTP to this machine. Adding a
# redirect to https here would send the visitor back to Cloudflare, which would
# forward it here as http again, forever. "Always Use HTTPS" in the Cloudflare
# dashboard is where that redirect belongs.
#
# Everything below assumes conf.d/cloudflare.conf and conf.d/lobbyhub.conf are
# loaded; they define $from_cloudflare, $forwarded_scheme and the upstream.

server {
    listen      80;
    listen      [::]:80;
    server_name lobbyhub.gg;

    # Nothing on this machine is encrypted, so the only thing standing between a
    # port scan and the whole site is that it arrived through Cloudflare. 444 is
    # nginx closing the connection without an answer — a scanner learns nothing,
    # not even that something is listening.
    if ($from_cloudflare = 0) {
        return 444;
    }

    access_log /var/log/nginx/lobbyhub.access.log;
    error_log  /var/log/nginx/lobbyhub.error.log;

    # The frontend posts nothing larger than an add-server form.
    client_max_body_size 1m;

    # Cloudflare compresses at the edge; this is for the hop between here and
    # there, which is the one paying for a 200 KB HTML shell.
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied    any;

    # Cache invalidation, called by Laravel over loopback. Public reachability
    # buys nothing and would put a rebuild-the-world button behind one guessed
    # header, so it is answered only from this machine. Keep the API's
    # FRONTEND_REVALIDATE_URL pointing at 127.0.0.1 rather than the domain.
    location = /api/revalidate {
        allow 127.0.0.1;
        allow ::1;
        deny  all;

        proxy_pass       http://lobbyhub_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    # Build output: every file here carries a content hash in its name. Next
    # already marks it immutable for a year, and that header is left alone —
    # adding one here would send two Cache-Controls and let Cloudflare pick.
    # The block exists to keep these out of the access log and off the timeouts
    # tuned for rendering below.
    location /_next/static/ {
        proxy_pass         http://lobbyhub_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;

        access_log off;
    }

    location / {
        proxy_pass         http://lobbyhub_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # A cache miss on a game page renders the listing from the API before it
        # answers. Rare, but it is a render and not a file read.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Next streams its responses; buffering them here would hold the shell
        # back until the dynamic parts underneath it finished.
        proxy_buffering off;
    }
}

# www exists because people type it. It never serves anything.
server {
    listen      80;
    listen      [::]:80;
    server_name www.lobbyhub.gg;

    if ($from_cloudflare = 0) {
        return 444;
    }

    return 301 https://lobbyhub.gg$request_uri;
}

# Anything else that resolves to this address — the raw IP, an old hostname, a
# scanner guessing — gets no answer at all. Without this, the first server block
# in the file would answer for all of them.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    return 444;
}
